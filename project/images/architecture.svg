<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
  <title id="title">Sports prototype architecture</title>
  <desc id="desc">Generated demo or permitted CSV enters validation and SQLite storage, followed by shared statistical analysis exposed through a CLI and JSON API. The web dashboard consumes the JSON API.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4b6578"/></marker></defs>
  <rect width="820" height="390" fill="#f5f8fa"/>
  <g fill="none" stroke="#4b6578" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 280 75 H 425"/><path d="M 595 112 V 153"/>
    <path d="M 550 232 V 282"/><path d="M 690 232 V 282"/>
    <path d="M 425 317 H 285"/>
  </g>
  <g stroke="#b5c8d6" stroke-width="1.5" fill="#fff">
    <rect x="40" y="38" width="240" height="74" rx="9"/>
    <rect x="425" y="38" width="345" height="74" rx="9"/>
    <rect x="425" y="158" width="345" height="74" rx="9"/>
    <rect x="425" y="287" width="165" height="60" rx="9"/>
    <rect x="610" y="287" width="160" height="60" rx="9"/>
    <rect x="40" y="287" width="240" height="60" rx="9"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#17354b" text-anchor="middle">
    <text x="160" y="69" font-size="16">Generated demo or</text><text x="160" y="93" font-size="16">permitted historical CSV</text>
    <text x="598" y="70" font-size="17">Validation and SQLite</text><text x="598" y="94" font-size="13" fill="#596f7e">Records and source / rights metadata</text>
    <text x="598" y="188" font-size="17">Shared statistical analysis</text><text x="598" y="214" font-size="13" fill="#596f7e">Rates, intervals, chronological evaluation</text>
    <text x="508" y="323" font-size="17">JSON API</text><text x="690" y="323" font-size="17">CLI</text><text x="160" y="323" font-size="17">Web dashboard</text>
  </g>
</svg>
